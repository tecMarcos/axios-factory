services:
  collector:
    build: .
    init: true
    environment:
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      OPERATIONAL_TOP_N: ${OPERATIONAL_TOP_N:-10}
      UPSELLER_PROFILE_DIR: /private/upseller-profile
    volumes:
      - ./data:/app/data
      - /opt/axios-factory-runtime/upseller-profile:/private/upseller-profile
    read_only: true
    tmpfs:
      - /tmp
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
