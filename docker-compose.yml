services:
  collector:
    build: .
    init: true
    environment:
      UPSELLER_PROFILE_DIR: /private/upseller-profile
    volumes:
      - ./data:/app/data
      - /opt/axios-factory/runtime/upseller-profile:/private/upseller-profile
    read_only: true
    tmpfs:
      - /tmp
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
