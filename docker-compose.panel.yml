# Painel de pedidos (celular / tag NFC), servido pelo Traefik do Easypanel com HTTPS.
# Subir:   sudo docker compose -f docker-compose.panel.yml --env-file /opt/axios-factory-runtime/panel.env up -d
# O panel.env (0600, fora do repositório) contém só PANEL_TOKEN, PANEL_DOMAIN e SCAN_KEY.
# Lê os snapshots do coletor em modo somente leitura; não acessa UpSeller nem WhatsApp.
name: axios-factory-panel
services:
  panel:
    image: node:24-bookworm-slim
    user: "1000:1000"
    working_dir: /app
    command: ["node", "--import", "tsx", "apps/panel/src/main.ts"]
    environment:
      PANEL_TOKEN: ${PANEL_TOKEN:?PANEL_TOKEN obrigatório}
      SCAN_KEY: ${SCAN_KEY:-}
      DATA_DIR: /data
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: "3100"
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Sao_Paulo}
      PERSONALIZATION_KEYWORDS: ${PERSONALIZATION_KEYWORDS:-natal,bolinha}
    volumes:
      - /opt/axios-factory:/app:ro
      - /opt/axios-factory/data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - easypanel
    labels:
      traefik.enable: "true"
      traefik.docker.network: easypanel
      traefik.http.services.axios-factory-panel.loadbalancer.server.port: "3100"
      traefik.http.routers.axios-factory-panel-http.rule: Host(`${PANEL_DOMAIN:?PANEL_DOMAIN obrigatório}`)
      traefik.http.routers.axios-factory-panel-http.entrypoints: http
      traefik.http.routers.axios-factory-panel-http.middlewares: redirect-to-https@file
      traefik.http.routers.axios-factory-panel-http.service: axios-factory-panel
      traefik.http.routers.axios-factory-panel.rule: Host(`${PANEL_DOMAIN}`)
      traefik.http.routers.axios-factory-panel.entrypoints: https
      traefik.http.routers.axios-factory-panel.tls.certresolver: letsencrypt
      traefik.http.routers.axios-factory-panel.service: axios-factory-panel
networks:
  easypanel:
    external: true
